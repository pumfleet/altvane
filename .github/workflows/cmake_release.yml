name: Release

# releases one product: push a <code>-vX.Y.Z tag (e.g. eq-v1.0.0), or run by hand for a test build
on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      product:
        description: Product to build (directory name under products/)
        required: true
        default: eq

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISPLAY: :0 # linux pluginval needs this
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  # every cmake configure (including JUCE's juceaide sub-build) compiles through sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  plan:
    # the product, and the platforms it builds on (products/<code>/PLATFORMS, see .github/release-matrix.json)
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.plan.outputs.product }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine product and platforms
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            product="${GITHUB_REF_NAME%-v*}" # eq-v1.0.0 -> eq
          else
            product="${{ inputs.product }}"
          fi
          [ -f "products/$product/CMakeLists.txt" ] || { echo "unknown product: $product"; exit 1; }
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 scripts/release_matrix.py "$product")" >> "$GITHUB_OUTPUT"

  build_and_test:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    env:
      PRODUCT: ${{ needs.plan.outputs.product }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Set up Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 21

      - name: Install Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt install libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libxi-dev ninja-build
          sudo /usr/bin/Xvfb $DISPLAY &

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache downloaded models # see products/dialogue/models
        if: env.PRODUCT == 'dialogue'
        uses: actions/cache@v4
        with:
          path: build/deps/models/
          key: models-${{ matrix.os }}-${{ hashFiles('products/*/models/models.cmake') }}

      - name: Set up sccache # compiler cache in the GitHub Actions cache; CMake picks it up from the env below
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Configure and Build (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DALTVANE_PRODUCTS=${{ env.PRODUCT }} ${{ matrix.cmake_extra_flags }} .
          cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars_script }}"
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DALTVANE_PRODUCTS=${{ env.PRODUCT }} ${{ matrix.cmake_extra_flags }} .
          cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Read in the product's .env from CMake # written by altvane_add_plugin
        shell: bash
        run: |
          cat "${{ env.BUILD_DIR }}/${{ env.PRODUCT }}.env" # show us the config
          cat "${{ env.BUILD_DIR }}/${{ env.PRODUCT }}.env" >> $GITHUB_ENV # pull in our PRODUCT_NAME, etc

      - name: Set additional env vars for next steps
        shell: bash
        run: |
          echo "ARTIFACT_NAME=${{ env.PROJECT_NAME }}-${{ env.VERSION }}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Check dependencies
        shell: bash
        run: python3 -u packaging/check_dependency.py

      - name: Import Certificates (macOS)
        uses: apple-actions/import-codesign-certs@v7 # only exists as a tag right now
        if: ${{ (runner.os == 'macOS') && (env.p12-file-base64 != '') }}
        with:
          p12-file-base64: ${{ secrets.DEV_ID_APP_CERT }}
          p12-password: ${{ secrets.DEV_ID_APP_PASSWORD }}
        env:
          p12-file-base64: ${{ secrets.DEV_ID_APP_CERT }}

      - name: Codesign and Create Individual Packages (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          python3 -u packaging/packager_macOS.py
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          # the installer only offers the architecture that was built
          MACOS_ARCH: ${{ matrix.macos_arch }}

      - name: Sign Final Package (macOS)
        if: ${{ (runner.os == 'macOS') && (env.APPLE_INSTALLER_DEV != '') }}
        run: productsign --sign "${{ secrets.APPLE_INSTALLER_DEV }}" "${{ env.ARTIFACT_NAME }}_unsigned.pkg" "${{ env.ARTIFACT_NAME }}.pkg"
        env:
          APPLE_INSTALLER_DEV: ${{ secrets.APPLE_INSTALLER_DEV }}

      - name: Rename Final Package (macOS)
        if: ${{ (runner.os == 'macOS') && (env.APPLE_INSTALLER_DEV == '') }}
        run: mv "${{ env.ARTIFACT_NAME }}_unsigned.pkg" "${{ env.ARTIFACT_NAME }}.pkg"
        env:
          APPLE_INSTALLER_DEV: ${{ secrets.APPLE_INSTALLER_DEV }}

      - name: Notarize and Staple PKG (macOS)
        if: ${{ (runner.os == 'macOS') && (env.NOTARIZATION_USERNAME != '')}}
        run: |
          xcrun notarytool submit "${{ env.ARTIFACT_NAME }}.pkg" --apple-id ${{ secrets.NOTARIZATION_USERNAME }} --password ${{ secrets.NOTARIZATION_PASSWORD }} --team-id ${{ secrets.TEAM_ID }} --wait
          xcrun stapler staple "${{ env.ARTIFACT_NAME }}.pkg"
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}

      - name: Create DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir "${{ env.ARTIFACTS_PATH }}/dmgtmp"
          mv "${{ env.ARTIFACT_NAME }}.pkg" "${{ env.ARTIFACTS_PATH }}/dmgtmp"
          hdiutil create "${{ env.ARTIFACTS_PATH }}/tmp.dmg" -ov -volname "${{ env.ARTIFACT_NAME }}" -fs HFS+ -srcfolder "${{ env.ARTIFACTS_PATH }}/dmgtmp" -format UDRW
          sync
          sleep 5
          hdiutil convert "${{ env.ARTIFACTS_PATH }}/tmp.dmg" -format UDZO -o "${{ env.ARTIFACT_NAME }}.dmg"

      - name: Upload DMG (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: "${{ env.ARTIFACT_NAME }}.dmg"

      - name: Install WiX v5 (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add the WiX UI Extension (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: wix extension add WixToolset.UI.wixext/5.0.2

      - name: Generate WiX (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        env:
          WIX_ARCH: ${{ matrix.wix_arch }}
        run: |
          python3 -u packaging/packager_Windows_WiX.py
          cat "packaging/installer.wxs"

      - name: Generate Installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          wix build packaging/installer.wxs -ext WixToolset.UI.wixext -arch ${{ matrix.wix_arch }} -o "packaging/${{ env.ARTIFACT_NAME }}.msi"
          mv "packaging/${{ env.ARTIFACT_NAME }}.msi" "${{ env.ARTIFACTS_PATH }}/"

      - name: Upload MSI (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.msi"

      - name: Generate Zip (Linux)
        if: ${{ runner.os == 'Linux' }}
        working-directory: ${{ env.ARTIFACTS_PATH }}
        run: 7z a -tzip "${{ env.ARTIFACT_NAME }}.zip" "-xr!lib${{ env.PRODUCT_NAME }}_SharedCode.a" .

      - name: Upload Zip (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: "${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.zip"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Get Artifacts
        uses: actions/download-artifact@v8
        with:
          path: installers/

      - name: Generate Signed Build Provenance Attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            installers/*/*.msi
            installers/*/*.zip
            installers/*/*.dmg

      - name: Create Release
        run: gh release create ${{ github.ref_name }} --prerelease installers/*/*.msi installers/*/*.zip installers/*/*.dmg