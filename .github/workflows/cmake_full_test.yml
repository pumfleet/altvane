name: macOS/Windows/Linux Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISPLAY: :0 # linux pluginval needs this
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  # every cmake configure (including JUCE's juceaide sub-build) compiles through sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  engine_untouched:
    # products built on an upstream engine vendor it unmodified (see products/*/UPSTREAM)
    name: Vendored engines are unmodified
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare vendored engines with their upstream pins
        run: |
          status=0
          for pin in products/*/UPSTREAM; do
            product=$(basename "$(dirname "$pin")")
            echo "== $product"
            scripts/check_upstream.sh "$product" || status=1
          done
          exit $status

  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            pluginval-binary: ./pluginval
            cmake_extra_flags: -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 -DALTVANE_FORMATS="VST3" -DALTVANE_SIMD_TARGET="AVX2" -DALTVANE_EQ_BAND_NUM=8
          - name: macOS
            os: macos-latest
            pluginval-binary: pluginval.app/Contents/MacOS/pluginval
            cmake_extra_flags: -DALTVANE_FORMATS="AU" -DALTVANE_SIMD_TARGET="NEON" -DALTVANE_EQ_BAND_NUM=8
          - name: Windows
            os: windows-latest
            wix_arch: x64
            vcvars_script: vcvars64.bat
            pluginval-binary: ./pluginval.exe
            cmake_extra_flags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DALTVANE_FORMATS="VST3" -DALTVANE_SIMD_TARGET="AVX2" -DALTVANE_EQ_BAND_NUM=8

    steps:
      - name: Set up Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 21

      - name: Install Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt install libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libxi-dev libfontconfig1-dev xvfb ninja-build
          sudo /usr/bin/Xvfb $DISPLAY &

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python (macOS) # building ONNX Runtime needs Python 3.10 or newer
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache built dependencies (macOS) # ONNX Runtime and the model files, see products/dialogue
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            build/deps/onnxruntime-1.*/
            build/deps/models/
          key: deps-${{ matrix.os }}-${{ hashFiles('scripts/build_onnxruntime.sh', 'products/*/models/required_operators.config', 'products/*/models/models.cmake') }}

      - name: Set up sccache # compiler cache in the GitHub Actions cache; CMake picks it up from the env below
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Configure and Build (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DALTVANE_BUILD_TESTS=ON -DALTVANE_LTO=OFF ${{ matrix.cmake_extra_flags }} .
          cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars_script }}"
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DALTVANE_BUILD_TESTS=ON -DALTVANE_LTO=OFF ${{ matrix.cmake_extra_flags }} .
          cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Unit tests
        shell: bash
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure

      - name: List products # one <code>.env per product, written by altvane_add_plugin
        shell: bash
        run: |
          for env in ${{ env.BUILD_DIR }}/*.env; do echo "== $env"; cat "$env"; done

      - name: Pluginval setup
        shell: bash
        run: |
          curl -LO "https://github.com/ZL-Audio/pluginval/releases/download/v1.0.4-temp/pluginval_${{ runner.os }}.zip"
          7z x pluginval_${{ runner.os }}.zip
          echo "PLUGINVAL_DISABLED=Plugin state restoration" >> $GITHUB_ENV

      - name: Setup Pluginval random seed
        id: setup_seed
        shell: bash
        run: |
          CURRENT_DATE_SEED=$(date +%y%m%d%H%M)
          echo "Generated Seed: $CURRENT_DATE_SEED"
          echo "RANDOM_SEED=$CURRENT_DATE_SEED" >> "$GITHUB_OUTPUT"

      - name: Pluginval VST3 validations
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          for env in ${{ env.BUILD_DIR }}/*.env; do
            VST3_PATH=$(sed -n 's/^VST3_PATH=//p' "$env")
            ${{ matrix.pluginval-binary }} --verbose --validate "$VST3_PATH" --disabled-tests "${{ env.PLUGINVAL_DISABLED }}"
          done
        env:
          STRICTNESS_LEVEL: 10
          TIMEOUT_MS: 1440000
          REPEAT: 2
          RANDOM_SEED: "${{ steps.setup_seed.outputs.RANDOM_SEED }}"

      - name: Pluginval AU validations (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          for env in ${{ env.BUILD_DIR }}/*.env; do
            AU_PATH=$(sed -n 's/^AU_PATH=//p' "$env")
            PRODUCT_NAME=$(sed -n 's/^PRODUCT_NAME=//p' "$env")
            sudo cp -r "$AU_PATH" "/Library/Audio/Plug-ins/components"
            sudo killall -9 AudioComponentRegistrar || true
            ${{ matrix.pluginval-binary }} --verbose --validate "/Library/Audio/Plug-ins/components/$PRODUCT_NAME.component" --disabled-tests "${{ env.PLUGINVAL_DISABLED }}"
          done
        env:
          STRICTNESS_LEVEL: 10
          TIMEOUT_MS: 1440000
          REPEAT: 2
          RANDOM_SEED: "${{ steps.setup_seed.outputs.RANDOM_SEED }}"
