name: macOS/Windows/Linux Heavy Test

on:
  schedule:
    - cron: "23 2 * * 0" # Sundays, 02:23 UTC, every product (see the products job)
  workflow_dispatch:
    inputs:
      product:
        description: Product to test (directory name under products/)
        required: true
        default: eq

# When pushing new commits, cancel any running builds on that branch (of this workflow: the scheduled run on main must
# not cancel, or be cancelled by, another workflow's run there)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISPLAY: :0 # linux pluginval needs this
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  # every cmake configure (including JUCE's juceaide sub-build) compiles through sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  products:
    # what to test: the product asked for or, on the schedule, every product; minus the runners a product can't build
    # on (products/<product>/PLATFORMS, read as the top-level CMakeLists.txt does)
    name: Products
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.list.outputs.products }}
      names: ${{ steps.list.outputs.names }}
      exclude: ${{ steps.list.outputs.exclude }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: List products and runners
        id: list
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          # each build_and_test entry's name and the platform it builds on, as <CMAKE_SYSTEM_NAME>-<arch>
          RUNNERS: '{"Linux": "Linux-x86_64", "macOS": "Darwin-arm64", "Windows": "Windows-AMD64"}'
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          runners = json.loads(os.environ["RUNNERS"])
          if os.environ["PRODUCT"]:
              products = [os.environ["PRODUCT"]]
          else:
              products = sorted(p.parent.name for p in pathlib.Path("products").glob("*/CMakeLists.txt"))
          exclude = []
          for product in products:
              platforms_file = pathlib.Path("products", product, "PLATFORMS")
              if platforms_file.exists():
                  lines = [line.strip() for line in platforms_file.read_text().splitlines()]
                  platforms = {line for line in lines if line and not line.startswith("#")}
                  exclude += [{"product": product, "name": name} for name, platform in runners.items()
                              if platform not in platforms]
          # a runner must keep a product: matrix include would turn an entry whose name is left in no combination
          # into a job of its own, with no product (e.g. dispatching dialogue). Such a runner builds what was asked.
          for name in runners:
              skipped = [e for e in exclude if e["name"] == name]
              if len(skipped) == len(products):
                  print(f"::warning::{products} not supported on {name} ({runners[name]}); building it there anyway")
                  exclude = [e for e in exclude if e["name"] != name]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"products={json.dumps(products)}\n")
              out.write(f"names={json.dumps(list(runners))}\n")
              out.write(f"exclude={json.dumps(exclude)}\n")
          print("products:", products, "\nskipped:", exclude)
          EOF

  build_and_test:
    name: ${{ matrix.name }} (${{ matrix.product }})
    needs: products
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.products.outputs.products) }}
        name: ${{ fromJSON(needs.products.outputs.names) }}
        exclude: ${{ fromJSON(needs.products.outputs.exclude) }}
        include:
          - name: Linux
            os: ubuntu-latest
            pluginval-binary: ./pluginval
            cmake_extra_flags: -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 -DALTVANE_FORMATS="VST3" -DALTVANE_SIMD_TARGET="AVX2"
          - name: macOS
            os: macos-latest
            pluginval-binary: pluginval.app/Contents/MacOS/pluginval
            cmake_extra_flags: -DALTVANE_FORMATS="VST3" -DALTVANE_SIMD_TARGET="NEON"
          - name: Windows
            os: windows-latest
            wix_arch: x64
            vcvars_script: vcvars64.bat
            pluginval-binary: ./pluginval.exe
            cmake_extra_flags: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DALTVANE_FORMATS="VST3" -DALTVANE_SIMD_TARGET="AVX2"

    steps:
      - name: Set up Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 21

      - name: Install Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt install libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libxi-dev xvfb ninja-build
          sudo /usr/bin/Xvfb $DISPLAY &

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up sccache # compiler cache in the GitHub Actions cache; CMake picks it up from the env below
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Configure and Build (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DALTVANE_PRODUCTS=${{ matrix.product }} ${{ matrix.cmake_extra_flags }} .
          cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars_script }}"
          cmake -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE}} -DALTVANE_PRODUCTS=${{ matrix.product }} ${{ matrix.cmake_extra_flags }} .
          cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Compiler cache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Read in the product's .env from CMake # written by altvane_add_plugin
        shell: bash
        run: |
          cat "${{ env.BUILD_DIR }}/${{ matrix.product }}.env" # show us the config
          cat "${{ env.BUILD_DIR }}/${{ matrix.product }}.env" >> $GITHUB_ENV # pull in our PRODUCT_NAME, etc

      - name: Pluginval setup
        shell: bash
        run: |
          curl -LO "https://github.com/ZL-Audio/pluginval/releases/download/v1.0.4-temp/pluginval_${{ runner.os }}.zip"
          7z x pluginval_${{ runner.os }}.zip
          echo "PLUGINVAL_DISABLED=Plugin state restoration" >> $GITHUB_ENV

      - name: Setup Pluginval random seed
        id: setup_seed
        shell: bash
        run: |
          CURRENT_DATE_SEED=$(date +%y%m%d%H%M)
          echo "Generated Seed: $CURRENT_DATE_SEED"
          echo "RANDOM_SEED=$CURRENT_DATE_SEED" >> "$GITHUB_OUTPUT"

      - name: Pluginval VST3 validations
        shell: bash
        run: |
          ${{ matrix.pluginval-binary }} --verbose --validate "${{ env.VST3_PATH }}" --disabled-tests "${{ env.PLUGINVAL_DISABLED }}"
        env:
          STRICTNESS_LEVEL: 10
          TIMEOUT_MS: 7200000
          REPEAT: 10
          RANDOM_SEED: "${{ steps.setup_seed.outputs.RANDOM_SEED }}"
